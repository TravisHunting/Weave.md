<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weave Server — Sign in</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head>
<body><main><div class="brand">W</div><h1>Weave Server</h1><p id="intro">Sign in to your workspace server.</p>
<form id="setup" hidden><label>Administrator username<input name="username" autocomplete="username" maxlength="128" value="admin" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><button type="submit">Create account</button></form>
<form id="login" hidden><label>Username<input name="username" autocomplete="username" maxlength="128" required></label><label>Password<input name="password" type="password" autocomplete="current-password" maxlength="1024" required></label><div id="challenge"></div><button type="submit">Sign in</button></form>
<form id="password" hidden><label>Current password<input name="current" type="password" autocomplete="current-password" maxlength="1024" required></label><label>New password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><button type="submit">Change password</button></form>
<p id="status" role="status" aria-live="polite"></p><nav id="account" hidden><a href="/">Open workspaces</a><button id="logout" type="button">Sign out</button></nav></main></body></html>
