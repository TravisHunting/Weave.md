[package]
name = "weave"
version = "1.0.0"
description = "Weave local Markdown knowledge"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"], optional = true }
serde = { version = "1", features = ["derive"] }
url = "2"
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
notify = "8"
sha2 = "0.10"
regex = "1"
serde_yaml = "0.9"
argon2 = { version = "0.5", optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
rpassword = { version = "7", optional = true }
zeroize = { version = "1", optional = true }
fs2 = "0.4"
same-file = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }


[features]
default = ["desktop"]
desktop = ["server", "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
server = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio", "dep:argon2", "dep:rand_core", "dep:reqwest", "dep:rpassword", "dep:zeroize", "dep:windows-sys", "dep:libc"]
native-test-host = []

[[bin]]
name = "weave"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "weave-server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "weave-test-host"
path = "src/bin/test_host.rs"
required-features = ["native-test-host"]
